<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak it! | Create Account</title>
</head>
<body>

    <header>
        <nav>
            <div class="logo">
                <h2><a href="../index.html">Speak it!</a></h2>
            </div>
            <div>
                <p>Because the best way to learn a language is to <i>Speak it!</i></p>
            </div>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="forum.html">Forum</a></li>
                <li><a href="login.html">Log In</a></li>
                <li><a href="register.html">Sign Up</a></li>
                <li><a href="https://github.com/roxana-xdx" target="_blank" rel="noopener noreferrer">My GitHub</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="auth-container">
            <h1>Start your journey</h1>
            <p>Create a free account and choose your target language.</p>

            <form action="dashboard.html" method="GET">
                <div>
                    <label for="username">Username:</label><br>
                    <input type="text" id="username" name="username" required>
                </div>
                <br>
                <div>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" required>
                </div>
                <br>
                <div>
                    <label for="native-lang">Your Native Language:</label><br>
                    <select id="native-lang" name="native-lang">
                        <option value="en">English</option>
                        <option value="ro">Romanian</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="xx">Other</option>
                    </select>
                </div>
                <br>
                <div>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password" required minlength="8">
                </div>
                <br>
                <button type="submit">Create Account</button>
            </form>
            
            <p>Already have an account? <a href="login.html">Log in here</a>.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 <i>Speak it!</i>. All rights reserved.</p>
    </footer>

</body>
</html>
